# Godot-EX's own CI, run in place of upstream's runner.yml (every platform's
# builds on every push): upstream's static checks on what a push changed.
# Upstream's runner stays in the tree for merges. It is disabled on this
# repository (`gh workflow disable runner.yml`, and the repository variable
# DISABLE_GODOT_CI, which runner.yml already reads), so a push runs only this
# workflow.
name: Godot-EX CI
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    uses: ./.github/workflows/static_checks.yml
